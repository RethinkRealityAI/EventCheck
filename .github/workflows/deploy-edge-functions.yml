# Deploy Supabase edge functions.
#
# Netlify only ships the frontend, so every merge that touched
# supabase/functions/** used to sit undeployed until someone ran the CLI by
# hand. That gap is how PR #20's payment logging and PR #21's email link fixes
# ended up merged but inert. This closes it, and gives a button that works from
# a phone.
#
# Setup (one time, all doable from a browser):
#   1. Supabase dashboard → account menu → Access Tokens → Generate new token.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret → name: SUPABASE_ACCESS_TOKEN, value: the token.
#
# Then: Actions → "Deploy edge functions" → Run workflow → pick a target.
#
# Project refs are not secrets — they're already public in the client bundle
# (VITE_SUPABASE_URL), so they live here in plain sight for legibility.

name: Deploy edge functions

on:
  # Manual run — pick which tenant to deploy to.
  workflow_dispatch:
    inputs:
      target:
        description: Which project to deploy to
        required: true
        default: both
        type: choice
        options: [both, gansid, scago]
  # Automatic on merge to main, but ONLY when a function actually changed.
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

env:
  GANSID_REF: gticuvgclbvhwvpzkuez
  SCAGO_REF: iigbgbgakevcgilucvbs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify the access token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      # ── Gate: never deploy code the compiler has not seen ──────────────────
      # On 2026-08-19 an undefined variable (`tpl` referenced in a mode that has
      # none) reached BOTH tenants and 500'd every free-registration invite for
      # ~95 minutes. Nothing caught it: the file carried @ts-nocheck, the root
      # tsc excludes supabase/functions, and this workflow deployed with no type
      # or lint step at all. These two checks are why that cannot recur —
      # check:edge-types resolves Deno/npm/https imports via deno-shims.d.ts and
      # fails on any identifier that does not exist.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and scope-check the edge functions
        run: npm run check:edge

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # A push to main deploys both tenants; a manual run honours the choice.
          TARGET: ${{ github.event.inputs.target || 'both' }}
        run: |
          set -euo pipefail

          # Every function in the repo. `supabase functions deploy <name>` reads
          # supabase/config.toml, so each one keeps its intended verify_jwt
          # setting — deploying verify-payment with the gateway JWT check left on
          # would break public checkout, and this is what prevents that.
          FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d \
            ! -name '_shared' -printf '%f\n' | sort)
          echo "Functions: $(echo "$FUNCTIONS" | tr '\n' ' ')"

          # --use-api bundles on Supabase's servers. Without it the CLI pulls
          # its edge-runtime bundler image from ghcr.io for every function,
          # and on 2026-09-23 a registry rate limit ("toomanyrequests")
          # aborted a deploy before a single function shipped — leaving a
          # merged security fix undeployed. No Docker pull, no registry limit.
          #
          # Each function also gets three attempts with a growing pause, so a
          # transient API hiccup cannot stop the loop halfway and leave the
          # two tenants running different versions of the code.
          deploy_one() {
            local fn="$1" ref="$2" attempt
            for attempt in 1 2 3; do
              if supabase functions deploy "$fn" --project-ref "$ref" --use-api; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::$fn failed to deploy (attempt $attempt of 3) — retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
            echo "::error::$fn did not deploy to $ref after 3 attempts"
            return 1
          }

          deploy_to() {
            local ref="$1" label="$2"
            echo "::group::Deploying to $label ($ref)"
            for fn in $FUNCTIONS; do
              echo "→ $fn"
              deploy_one "$fn" "$ref"
            done
            echo "::endgroup::"
          }

          case "$TARGET" in
            gansid) deploy_to "$GANSID_REF" GANSID ;;
            scago)  deploy_to "$SCAGO_REF" SCAGO ;;
            both)   deploy_to "$GANSID_REF" GANSID; deploy_to "$SCAGO_REF" SCAGO ;;
            *) echo "::error::Unknown target: $TARGET"; exit 1 ;;
          esac

      - name: Smoke test — confirm the new code is live
        env:
          TARGET: ${{ github.event.inputs.target || 'both' }}
        run: |
          set -uo pipefail
          # `log-payment-error` only exists in the post-PR-#20 verify-payment, so
          # a 200 here proves the deploy replaced the old version rather than
          # silently no-opping.
          check() {
            local ref="$1" label="$2"
            local body
            body=$(curl -sS -X POST "https://${ref}.supabase.co/functions/v1/verify-payment" \
              -H "Content-Type: application/json" \
              -d '{"mode":"log-payment-error","provider":"paypal","stage":"ci-smoke","message":"deploy smoke test"}' || true)
            echo "$label: $body"
            case "$body" in
              *'"ok":true'*) echo "  ✓ new code is live" ;;
              *) echo "::error::$label smoke test failed — old code may still be running. Response: $body"; return 1 ;;
            esac

            # send-ticket-email must refuse caller-written HTML from an
            # unauthenticated caller (_shared/senderAuth.ts). Anything but a
            # 401 means the open-relay fix is not running on this tenant.
            # The probe address is RFC 2606 `.invalid`, so even old code
            # could not deliver it anywhere.
            local code
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "https://${ref}.supabase.co/functions/v1/send-ticket-email" \
              -H "Content-Type: application/json" \
              -d '{"mode":"raw-html","to":"ci-smoke@example.invalid","subject":"ci smoke","html":"<p>ci smoke</p>"}' || true)
            if [ "$code" = "401" ]; then
              echo "  ✓ unauthenticated raw-html send refused (401)"
            else
              echo "::error::$label send-ticket-email accepted an unauthenticated raw-html send (HTTP $code) — the relay fix is not live"
              return 1
            fi
          }
          rc=0
          case "$TARGET" in
            gansid) check "$GANSID_REF" GANSID || rc=1 ;;
            scago)  check "$SCAGO_REF" SCAGO || rc=1 ;;
            both)   check "$GANSID_REF" GANSID || rc=1; check "$SCAGO_REF" SCAGO || rc=1 ;;
          esac
          exit $rc
